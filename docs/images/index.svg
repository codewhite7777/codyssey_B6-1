"417.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">#10</text><rect x="440" y="36" width="34" height="46" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="457.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">4</text><text x="457.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">#11</text><rect x="480" y="36" width="34" height="46" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="497.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">1</text><text x="497.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">#12</text><rect x="520" y="36" width="34" height="46" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="537.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">10</text><text x="537.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">#13</text><rect x="560" y="36" width="34" height="46" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="577.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">6</text><text x="577.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">#14</text><rect x="600" y="36" width="34" height="46" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="617.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">2</text><text x="617.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">#15</text><text x="40" y="100" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">위 = member_id, 아래 = 대여 번호. 1번 회원 기록이 1, 3, 6, 12번 줄에 흩어져 있음</text><text x="40" y="146" text-anchor="start" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">인덱스 있음: member_id 순서로 정리한 찾아보기 (CREATE INDEX가 만드는 것)</text><rect x="40" y="162" width="68" height="52" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/><text x="74.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">회원 1</text><text x="74.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">1,3,6,12</text><rect x="116" y="162" width="68" height="52" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="150.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">회원 2</text><text x="150.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">2,8,15</text><rect x="192" y="162" width="68" height="52" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="226.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">회원 4</text><text x="226.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">4,11</text><rect x="268" y="162" width="68" height="52" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="302.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">회원 5</text><text x="302.0" y="198.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">5</text><rect x="344" y="162" width="68" height="52" rx="5" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="378.0" y="179.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weig