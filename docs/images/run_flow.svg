<svg xmlns="http://www.w3.org/2000/svg" width="680" height="546" viewBox="0 0 680 546" font-family="-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" role="img"><title>실행 흐름: 레포 받기부터 쿼리 실행까지</title><rect width="680" height="546" fill="#FFFFFF" rx="12"/><text x="38" y="51.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#5F5E5A">1</text><rect x="60" y="24" width="440" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="280.0" y="41.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">git clone  →  cd codyssey_b6-1</text><text x="280.0" y="62.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">레포를 받고 레포 폴더로 이동</text><line x1="280.0" y1="78" x2="280.0" y2="92" stroke="#5F5E5A" stroke-width="1.3"/><path d="M275.0 90 L280.0 98 L285.0 90" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><text x="38" y="125.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#5F5E5A">2</text><rect x="60" y="98" width="440" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="280.0" y="115.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">sqlite3 library.db</text><text x="280.0" y="136.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">DB 파일을 열기 (없으면 새로 만듦) → sqlite> 표시</text><line x1="280.0" y1="152" x2="280.0" y2="166" stroke="#5F5E5A" stroke-width="1.3"/><path d="M275.0 164 L280.0 172 L285.0 164" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><text x="38" y="199.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#5F5E5A">3</text><rect x="60" y="172" width="440" height="54" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="280.0" y="189.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">PRAGMA · .mode · .headers · .nullvalue</text><text x="280.0" y="210.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#0F6E56">FK 검사 켜기, 결과를 표 모양으로 보기</text><line x1="280.0" y1="226" x2="280.0" y2="240" stroke="#5F5E5A" stroke-width="1.3"/><path d="M275.0 238 L280.0 246 L285.0 238" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><text x="38" y="273.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#5F5E5A">4</text><rect x="60" y="246" width="440" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="280.0" y="263.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">.read sql/01_schema.sql</text><text x="280.0" y="284.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">테이블 4개 만들기 (DROP 후 CREATE)</text><line x1="280.0" y1="300" x2="280.0" y2="314" stroke="#5F5E5A" stroke-width="1.3"/><path d="M275.0 312 L280.0 320 L285.0 312" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><text x="38" y="347.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#5F5E5A">5</text><rect x="60" y="320" width="440" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="280.0" y="337.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">.read sql/02_data.sql</text><text x="280.0" y="358.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">샘플 데이터 넣기 (10 + 10 + 12 + 15행)</text><line x1="280.0" y1="374" x2="280.0" y2="388" stroke="#5F5E5A" stroke-width="1.3"/><path d="M275.0 386 L280.0 394 L285.0 386" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><text x="38" y="421.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#5F5E5A">6</text><rect x="60" y="394" width="440" height="54" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="280.0" y="411.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">.read sql/03_queries.sql</text><text x="280.0" y="432.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#534AB7">Q01 ~ Q15 실행 → 결과 표 출력</text><line x1="280.0" y1="448" x2="280.0" y2="462" stroke="#5F5E5A" stroke-width="1.3"/><path d="M275.0 460 L280.0 468 L285.0 460" fill="none" stroke="#5F5E5A" stroke-width="1.3"/><text x="38" y="495.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#5F5E5A">7</text><rect x="60" y="468" width="440" height="54" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="280.0" y="485.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">.quit</text><text x="280.0" y="506.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="400" fill="#888780">SQLite 끝내고 터미널로 돌아가기</text><path d="M520 24 L530 24 L530 152 L520 152" fill="none" stroke="#888780" stroke-width="1"/><text x="540" y="79.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#5F5E5A">터미널</text><text x="540" y="97.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">$ 에서 입력</text><path d="M520 172 L530 172 L530 522 L520 522" fill="none" stroke="#888780" stroke-width="1"/><text x="540" y="338.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#5F5E5A">SQLite 안</text><text x="540" y="356.0" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="400" fill="#5F5E5A">sqlite> 에서 입력</text></svg>
